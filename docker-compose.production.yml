services:
  app:
    image: ${LINX_IMAGE:?LINX_IMAGE must be set}
    restart: unless-stopped
    init: true
    # 以服务器部署用户运行，便于无 sudo 的 PortForward 主机使用外部运行时目录。
    # 镜像仍以内置非 root 用户构建；这里的 UID 由部署主机的 qiniu 用户提供。
    user: "1000:1000"
    cap_drop:
      - ALL
    ports:
      - "${LINX_BIND_HOST:-127.0.0.1}:${LINX_API_HOST_PORT:-5000}:5000"
      - "${LINX_BIND_HOST:-127.0.0.1}:${LINX_CLIENT_HOST_PORT:-5010}:5010"
      - "${LINX_BIND_HOST:-127.0.0.1}:${LINX_MCP_HOST_PORT:-9091}:9091"
    volumes:
      - ${LINX_RUNTIME_ENV_FILE:-/etc/linx-night/runtime.env}:/run/linx-night/runtime.env:ro
      - ${LINX_DATA_DIR:-/var/lib/linx-night}/LinxNight:/var/lib/linx-night/LinxNight
    environment:
      LINX_BUILD_ID: ${LINX_BUILD_ID:-unknown}
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([5000,5010,9091].map(p=>fetch('http://127.0.0.1:'+p+(p===5010?'/':'/health')))).then(r=>{if(r.some(x=>!x.ok))process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
