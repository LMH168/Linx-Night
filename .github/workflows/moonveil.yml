name: Moonveil example

on:
  push:
    paths:
      - 'examples/moonveil/**'
      - '.github/workflows/moonveil.yml'
  pull_request:
    paths:
      - 'examples/moonveil/**'
      - '.github/workflows/moonveil.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    defaults:
      run:
        working-directory: examples/moonveil
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: examples/moonveil/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run package
