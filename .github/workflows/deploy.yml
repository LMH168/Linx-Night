name: Linx-Night 自动部署

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: linx-night-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: 测试
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 静态检查
        run: npm run check

      - name: Vue 客户端类型与配置回归
        run: |
          npm run typecheck:client-vue
          npm run test:client-vue
          npm run test:deploy-config

      - name: 领域、API、MCP、客户端和语音回归
        run: |
          npm run test:domain
          npm run test:api
          npm run test:mcp
          npm run test:client
          npm run test:voice

  image:
    name: 构建并推送镜像
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 计算镜像名称
        id: meta
        shell: bash
        run: |
          image="ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
            ${{ steps.meta.outputs.image }}:main
          cache-from: type=gha,scope=linx-night
          cache-to: type=gha,mode=max,scope=linx-night

  deploy:
    name: 部署到服务器
    needs: image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 准备 SSH
        env:
          SSH_KEY: ${{ secrets.LINX_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.LINX_DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$SSH_KEY"
          test -n "$KNOWN_HOSTS"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/linx-night-deploy"
          printf '%s\n' "$KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/linx-night-deploy" "$HOME/.ssh/known_hosts"

      - name: 上传部署文件
        env:
          HOST: ${{ secrets.LINX_DEPLOY_HOST }}
          USER: ${{ secrets.LINX_DEPLOY_USER }}
          PORT: ${{ secrets.LINX_DEPLOY_PORT }}
          ROOT: ${{ vars.LINX_DEPLOY_ROOT || '/home/qiniu/linx-night' }}
        run: |
          test -n "$HOST"
          test -n "$USER"
          test -n "$PORT"
          ssh -p "$PORT" -i "$HOME/.ssh/linx-night-deploy" "$USER@$HOST" "mkdir -p '$ROOT'"
          scp -P "$PORT" -i "$HOME/.ssh/linx-night-deploy" \
            Dockerfile docker-compose.production.yml deploy/remote-deploy.sh \
            "$USER@$HOST:$ROOT/"

      - name: 执行部署并健康检查
        env:
          HOST: ${{ secrets.LINX_DEPLOY_HOST }}
          USER: ${{ secrets.LINX_DEPLOY_USER }}
          PORT: ${{ secrets.LINX_DEPLOY_PORT }}
          ROOT: ${{ vars.LINX_DEPLOY_ROOT || '/home/qiniu/linx-night' }}
          IMAGE: ${{ needs.image.outputs.image }}:${{ github.sha }}
        run: |
          ssh -p "$PORT" -i "$HOME/.ssh/linx-night-deploy" "$USER@$HOST" \
            "chmod 0750 '$ROOT/remote-deploy.sh' && LINX_DEPLOY_ROOT='$ROOT' '$ROOT/remote-deploy.sh' '$IMAGE'"
