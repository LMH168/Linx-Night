<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linx Night · 月下议事</title><link rel="stylesheet" href="/style.css"></head>
<body>
<main class="shell">
  <header class="masthead"><a class="brand" href="/">◒ <span>LINX NIGHT</span></a><span class="edition">九人局 · 月下议事</span></header>
  <section class="intro"><div><p class="eyebrow">当夜幕降临，故事由你开始</p><h1>今夜，谁值得信任？</h1><p class="muted">3 狼人 · 预言家 · 女巫 · 猎人 · 3 平民</p></div><span class="moon" aria-hidden="true">☾</span></section>
  <section class="card" id="entryCard"><div class="section-heading"><h2>入座之前</h2><span class="muted">邀请朋友，或让机器人补齐空位</span></div><div class="entry-grid"><label>你的昵称<input id="displayName" placeholder="输入昵称" maxlength="24" autocomplete="nickname"></label><button id="create">创建房间 ↗</button><label>加入朋友的房间<input id="roomId" placeholder="粘贴房间号" autocomplete="off"></label><button class="secondary" id="join">加入房间</button></div><details><summary>连接设置</summary><label>服务端地址<input id="apiUrl" value="http://localhost:5000"></label></details></section>
  <p id="message" class="message" role="status" aria-live="polite"></p>
  <section class="card table-card"><div class="section-heading"><div><p class="eyebrow">THE TABLE / 对局席位</p><h2 id="roomLabel">等待入座</h2></div><span id="phase" class="badge">未进入房间</span></div><p id="counts" class="muted">创建或加入房间，开启今晚的对局。</p><div id="seats" class="seats"></div><div id="lobbyBar" class="lobby-bar" hidden><div><p id="lobbyHint">等待房主开始游戏</p><p id="controllerHint" class="muted" hidden></p></div><div class="action-buttons"><button id="start" hidden>开始游戏 →</button><button id="retryControllers" class="secondary" hidden>重试连接</button><button id="cancelControllers" class="secondary" hidden>取消开始</button></div></div></section>
  <section id="resultCard" class="card result" hidden><p class="eyebrow">THE END / 本局结束</p><h2 id="resultTitle"></h2><p>感谢参与。可在上方创建新房间，再来一局。</p></section>
  <div class="game-grid">
    <aside id="privateCard" class="card identity-card" hidden><p class="eyebrow">仅你可见</p><h2 id="identity"></h2><p id="roleDescription" class="muted"></p><p id="skills" class="role-detail"></p></aside>
    <section id="actionCard" class="card" hidden><div class="section-heading"><h2 id="actionTitle">等待行动</h2><span class="live-dot" aria-hidden="true"></span></div><p id="turnHint" class="muted"></p><label id="speechField" hidden>你的发言<textarea id="speechText" placeholder="说出你的判断，让大家听到你的声音。" rows="4"></textarea><span class="voice-tools"><button id="voiceStart" class="secondary" type="button">🎙 语音转文字</button><button id="voiceCancel" class="secondary" type="button" hidden>清除草稿</button><small id="voiceStatus" class="muted" role="status" aria-live="polite">语音只生成草稿，不会自动提交。</small></span></label><div class="action-fields"><label id="witchField" hidden>选择用药<select id="witchAction"><option value="skip">今晚不用药</option><option value="save">使用解药</option><option value="poison">使用毒药</option></select></label><label id="targetField" hidden>选择目标<select id="target"></select></label></div><div class="action-buttons"><button id="speech" hidden>确认并提交发言</button><button id="skill" hidden>确认行动</button><button id="hunterShot" hidden>确认开枪</button><button id="hunterSkip" class="secondary" hidden>跳过开枪</button><button id="vote" hidden>确认投票</button><button id="announce" hidden>宣布天亮</button></div></section>
  </div>
  <section id="eventCard" class="card" hidden><div class="section-heading"><h2>桌边记录</h2><span class="muted">公开发言与对局结果</span></div><p id="emptyEvents" class="empty">夜色正浓，等待第一条消息。</p><ol id="events" class="events"></ol></section>
  <footer>LINX NIGHT <span>在发言中寻找线索，在沉默中保持判断。</span></footer>
</main><script type="module" src="/app.js"></script>
</body></html>
